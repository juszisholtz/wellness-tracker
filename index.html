<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Wellness Tracker</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Wellness">
  <meta name="theme-color" content="#7c3aed">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- ▸ STEP 4a: Replace with your Google Client ID -->
  <meta name="google-signin-client_id" content="17203015350-9c5u2ecr3rrqluhq45lh9ek7migkskf3.apps.googleusercontent.com">

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
:root {
  --primary:       #7c3aed;
  --primary-light: #ede9fe;
  --primary-mid:   #a78bfa;
  --bg:            #fafaf9;
  --surface:       #ffffff;
  --text:          #1c1917;
  --text-muted:    #78716c;
  --border:        #e7e5e4;
  --success:       #16a34a;
  --danger:        #dc2626;
  --radius:        14px;
  --nav-h:         72px;
  --header-h:      56px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ═══════════════════════════════════════
   LOGIN SCREEN
═══════════════════════════════════════ */
#login-screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: linear-gradient(160deg, #f5f3ff 0%, #fafaf9 50%, #fff7ed 100%);
  padding: 32px 24px;
  z-index: 100;
}
#login-screen.hidden { display: none; }

.login-logo {
  width: 72px; height: 72px;
  background: var(--primary);
  border-radius: 22px;
  display: flex; align-items: center; justify-content: center;
  font-size: 36px;
  margin-bottom: 28px;
  box-shadow: 0 8px 32px rgba(124, 58, 237, 0.3);
}
.login-title {
  font-size: 28px; font-weight: 700; letter-spacing: -0.5px;
  text-align: center; margin-bottom: 8px;
}
.login-sub {
  font-size: 15px; color: var(--text-muted);
  text-align: center; margin-bottom: 40px; line-height: 1.5;
}
#google-btn-wrap {
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.login-note {
  font-size: 12px; color: var(--text-muted); text-align: center;
  max-width: 260px; line-height: 1.5;
}

/* ═══════════════════════════════════════
   APP SHELL
═══════════════════════════════════════ */
#app {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
}
#app.hidden { display: none; }

/* Header */
.app-header {
  height: var(--header-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px;
  padding-top: env(safe-area-inset-top);
  flex-shrink: 0;
}
.header-title { font-size: 18px; font-weight: 600; }
.header-right { display: flex; align-items: center; gap: 12px; }
.user-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  object-fit: cover; border: 2px solid var(--primary-light);
  cursor: pointer;
}
.refresh-btn {
  background: none; border: none; cursor: pointer;
  color: var(--text-muted); font-size: 18px; padding: 4px;
  display: flex; align-items: center;
}
.refresh-btn:active { transform: rotate(180deg); transition: transform 0.4s; }

/* Tab Content */
.tab-content {
  flex: 1; overflow: hidden; position: relative;
}
.tab-panel {
  position: absolute; inset: 0;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 20px 20px calc(var(--nav-h) + 12px);
  opacity: 0; pointer-events: none; transform: translateY(8px);
  transition: opacity 0.2s, transform 0.2s;
}
.tab-panel.active {
  opacity: 1; pointer-events: auto; transform: translateY(0);
}

/* Bottom Nav */
.bottom-nav {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex; align-items: flex-start; padding-top: 8px;
  flex-shrink: 0;
}
.nav-btn {
  flex: 1; border: none; background: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 0; color: var(--text-muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 11px; font-weight: 500;
  transition: color 0.15s;
}
.nav-btn.active { color: var(--primary); }
.nav-icon {
  width: 44px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 10px;
  transition: background 0.15s;
}
.nav-btn.active .nav-icon { background: var(--primary-light); }
.nav-icon svg { width: 22px; height: 22px; }

/* ═══════════════════════════════════════
   SHARED COMPONENTS
═══════════════════════════════════════ */
.section-title {
  font-size: 20px; font-weight: 700; letter-spacing: -0.3px;
  margin-bottom: 14px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 16px;
}
.loading-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(250,250,249,0.85);
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(2px);
}
.loading-overlay.hidden { display: none; }
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--primary-light);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty-state {
  text-align: center; padding: 48px 24px;
  color: var(--text-muted); font-size: 15px; line-height: 1.6;
}
.empty-state span { font-size: 40px; display: block; margin-bottom: 12px; }

/* ═══════════════════════════════════════
   DASHBOARD
═══════════════════════════════════════ */
.chart-card { padding: 18px 12px 12px; }
.chart-header {
  font-size: 16px; font-weight: 600; margin-bottom: 4px; padding: 0 6px;
}
.chart-wrap { position: relative; height: 200px; }

.insights-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  margin-bottom: 16px;
}
.insight-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
}
.insight-label {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 6px;
}
.insight-score {
  font-size: 26px; font-weight: 700; letter-spacing: -0.5px; line-height: 1;
  margin-bottom: 4px;
}
.insight-delta {
  font-size: 12px; font-weight: 500;
  display: flex; align-items: center; gap: 4px;
}
.dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.dot.up   { background: var(--success); }
.dot.down { background: var(--danger); }
.dot.flat { background: var(--text-muted); }

.top-list { list-style: none; }
.top-list li {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  font-size: 15px;
}
.top-list li:last-child { border-bottom: none; }
.top-list .rank {
  font-size: 12px; font-weight: 700; color: var(--primary);
  width: 20px; flex-shrink: 0;
}
.top-list .day-date { font-weight: 500; color: var(--text); flex: 1; margin-left: 8px; }
.top-list .day-score { font-weight: 600; color: var(--text-muted); font-size: 14px; }

/* ═══════════════════════════════════════
   CHECK-IN
═══════════════════════════════════════ */
.checkin-form { display: flex; flex-direction: column; gap: 0; }

.field-group { margin-bottom: 20px; }
.field-label {
  font-size: 14px; font-weight: 600; margin-bottom: 2px;
}
.field-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }

/* Date input */
.date-input {
  width: 100%; padding: 14px 16px;
  border: 1.5px solid var(--border); border-radius: var(--radius);
  font-family: 'DM Sans', sans-serif;
  font-size: 16px; font-weight: 500;
  background: var(--surface); color: var(--text);
  outline: none; appearance: none;
  transition: border-color 0.15s;
}
.date-input:focus { border-color: var(--primary); }

/* Sliders */
.slider-track {
  position: relative; height: 48px;
  display: flex; align-items: center;
}
.slider-labels {
  display: flex; justify-content: space-between;
  font-size: 11px; color: var(--text-muted);
  margin-top: -4px; padding: 0 2px;
}
input[type=range] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 6px;
  background: transparent; outline: none; cursor: pointer;
}
input[type=range]::-webkit-slider-runnable-track {
  height: 6px; border-radius: 3px;
  background: var(--border);
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--primary);
  border: 3px solid white;
  box-shadow: 0 2px 8px rgba(124,58,237,0.35);
  margin-top: -10px;
  cursor: grab;
  transition: transform 0.1s, box-shadow 0.1s;
}
input[type=range]:active::-webkit-slider-thumb {
  transform: scale(1.15);
  box-shadow: 0 4px 16px rgba(124,58,237,0.45);
  cursor: grabbing;
}
input[type=range]::-moz-range-thumb {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--primary); border: 3px solid white;
  box-shadow: 0 2px 8px rgba(124,58,237,0.35);
  cursor: grab;
}
.slider-value-badge {
  position: absolute; top: -4px;
  background: var(--primary); color: white;
  font-size: 12px; font-weight: 700;
  padding: 2px 7px; border-radius: 20px;
  pointer-events: none;
  transform: translateX(-50%);
  white-space: nowrap;
  transition: left 0.05s;
}

/* Text area */
.highlight-input {
  width: 100%; min-height: 100px;
  padding: 14px 16px;
  border: 1.5px solid var(--border); border-radius: var(--radius);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px; line-height: 1.5;
  background: var(--surface); color: var(--text);
  resize: none; outline: none;
  transition: border-color 0.15s;
}
.highlight-input:focus { border-color: var(--primary); }

/* Save button */
.save-btn {
  width: 100%; padding: 16px;
  background: var(--primary); color: white;
  border: none; border-radius: var(--radius);
  font-family: 'DM Sans', sans-serif;
  font-size: 16px; font-weight: 600;
  cursor: pointer; margin-top: 8px;
  transition: background 0.15s, transform 0.1s;
}
.save-btn:active { background: #6d28d9; transform: scale(0.99); }
.save-btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

.toast {
  position: fixed; bottom: calc(var(--nav-h) + 20px); left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--text); color: white;
  padding: 12px 20px; border-radius: 30px;
  font-size: 14px; font-weight: 500;
  opacity: 0; transition: all 0.3s; z-index: 300;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { background: var(--success); }
.toast.error   { background: var(--danger); }

/* ═══════════════════════════════════════
   HISTORY
═══════════════════════════════════════ */
.history-scroll { overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
table {
  width: 100%; border-collapse: collapse;
  font-size: 13px; min-width: 500px;
}
thead th {
  text-align: left; padding: 10px 12px;
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.4px; color: var(--text-muted);
  border-bottom: 1.5px solid var(--border);
  white-space: nowrap;
}
tbody td {
  padding: 13px 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text); vertical-align: middle;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--bg); }
.highlight-cell {
  max-width: 180px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
  color: var(--text-muted);
}
.score-pill {
  display: inline-block; padding: 2px 8px;
  border-radius: 20px; font-weight: 600;
  background: var(--primary-light); color: var(--primary);
}
</style>
</head>
<body>

<!-- Loading Overlay -->
<div class="loading-overlay hidden" id="loading">
  <div class="spinner"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- ══════════════════════════════════════
     LOGIN SCREEN
══════════════════════════════════════ -->
<div id="login-screen">
  <div class="login-logo">🌿</div>
  <h1 class="login-title">Wellness Tracker</h1>
  <p class="login-sub">Track what matters.<br>See what's working.</p>
  <div id="google-btn-wrap">
    <div id="google-btn"></div>
    <p class="login-note">Your data is private. Only you can see your check-ins.</p>
  </div>
</div>

<!-- ══════════════════════════════════════
     APP
══════════════════════════════════════ -->
<div id="app" class="hidden">

  <!-- Header -->
  <header class="app-header">
    <span class="header-title" id="header-title">Dashboard</span>
    <div class="header-right">
      <button class="refresh-btn" onclick="loadEntries()" title="Refresh">↻</button>
      <img class="user-avatar" id="user-avatar" src="" alt="Avatar" onclick="signOut()">
    </div>
  </header>

  <!-- Tab Content -->
  <div class="tab-content">

    <!-- ── Dashboard ── -->
    <div id="tab-dashboard" class="tab-panel active">

      <div class="card chart-card">
        <div class="chart-header">Wellness Trends</div>
        <div style="font-size:12px;color:var(--text-muted);padding:0 6px 10px;">Last 30 days</div>
        <div class="chart-wrap">
          <canvas id="trend-chart"></canvas>
        </div>
      </div>

      <p class="section-title">Weekly Insights</p>
      <div class="insights-grid" id="insights-grid">
        <!-- filled by JS -->
      </div>

      <div class="card">
        <p class="section-title" style="font-size:16px;">🏆 Top Weekends</p>
        <ul class="top-list" id="top-weekends"></ul>
      </div>

      <div class="card">
        <p class="section-title" style="font-size:16px;">💼 Top Weekdays</p>
        <ul class="top-list" id="top-weekdays"></ul>
      </div>

    </div>

    <!-- ── Daily Check-in ── -->
    <div id="tab-checkin" class="tab-panel">
      <div class="checkin-form">

        <div class="field-group">
          <div class="field-label">Date *</div>
          <input type="date" class="date-input" id="entry-date">
        </div>

        <!-- Sliders -->
        <div id="sliders-wrap">
          <!-- filled by JS -->
        </div>

        <div class="field-group">
          <div class="field-label">Highlight of the day</div>
          <div class="field-desc">Big or small — what stood out?</div>
          <textarea class="highlight-input" id="entry-highlight" placeholder="e.g. Had a great conversation with an old friend..."></textarea>
        </div>

        <button class="save-btn" id="save-btn" onclick="saveEntry()">Save Check-in</button>

      </div>
    </div>

    <!-- ── History ── -->
    <div id="tab-history" class="tab-panel">
      <div id="history-content">
        <!-- filled by JS -->
      </div>
    </div>

  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-dashboard" onclick="switchTab('dashboard')">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
      </div>
      Dashboard
    </button>
    <button class="nav-btn" id="nav-checkin" onclick="switchTab('checkin')">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12h8M12 8v8"/>
        </svg>
      </div>
      Daily Check-in
    </button>
    <button class="nav-btn" id="nav-history" onclick="switchTab('history')">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
      </div>
      History
    </button>
  </nav>
</div>

<script>
// ═══════════════════════════════════════════════
// CONFIG — update these two values in SETUP.md
// ═══════════════════════════════════════════════
const CONFIG = {
  CLIENT_ID:  '17203015350-9c5u2ecr3rrqluhq45lh9ek7migkskf3.apps.googleusercontent.com',   // ← Step 3
  SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbxqFxPqBq0-J11obpH5mfhPJ11Mc4oxkYTp75_4nWHpaYPq_Na7oP475oeJ-Sn2plbQ/exec'     // ← Step 2
};

// ── Slider definitions ──────────────────────────
const SLIDERS = [
  { id: 'energy',        label: 'Energy',        desc: 'How tired (or energized) you felt.' },
  { id: 'mental',        label: 'Mental',         desc: 'Your mental and emotional state overall.' },
  { id: 'relationships', label: 'Relationships',  desc: 'How connected you felt to others.' },
  { id: 'meaning',       label: 'Meaning',        desc: 'How meaningful did today feel?' }
];

// ── App State ───────────────────────────────────
const state = {
  user: null,
  entries: [],
  currentTab: 'dashboard',
  chart: null
};

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
window.addEventListener('load', () => {
  buildSliders();
  setTodayDate();

  // Try restoring session
  const saved = localStorage.getItem('wt_session');
  if (saved) {
    try {
      const session = JSON.parse(saved);
      if (!isTokenExpired(session.token)) {
        state.user = session;
        showApp();
        return;
      }
    } catch(e) {}
  }

  // Wait for GIS to load, then show login
  const waitGIS = setInterval(() => {
    if (window.google?.accounts?.id) {
      clearInterval(waitGIS);
      initGoogle();
    }
  }, 100);
});

function initGoogle() {
  google.accounts.id.initialize({
    client_id: CONFIG.CLIENT_ID,
    callback: onSignIn,
    auto_select: true,
    cancel_on_tap_outside: false
  });

  google.accounts.id.renderButton(document.getElementById('google-btn'), {
    theme: 'outline', size: 'large',
    text: 'signin_with', shape: 'rectangular', width: 280
  });

  // Try One Tap silent sign-in
  google.accounts.id.prompt();
}

function onSignIn(response) {
  const token = response.credential;
  const payload = parseJWT(token);
  state.user = {
    email:   payload.email,
    name:    payload.name,
    picture: payload.picture,
    token:   token
  };
  localStorage.setItem('wt_session', JSON.stringify(state.user));
  showApp();
}

function showApp() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('user-avatar').src = state.user.picture || '';
  loadEntries();
}

function signOut() {
  if (!confirm('Sign out?')) return;
  localStorage.removeItem('wt_session');
  state.user = null;
  state.entries = [];
  if (window.google?.accounts?.id) google.accounts.id.disableAutoSelect();
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
}

// ═══════════════════════════════════════════════
// API
// ═══════════════════════════════════════════════
async function api(action, data = {}) {
  const body = JSON.stringify({ action, token: state.user.token, data });
  const res = await fetch(CONFIG.SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body,
    redirect: 'follow'
  });
  const result = await res.json();
  if (result.error === 'Unauthorized') {
    // Token expired — prompt re-auth
    localStorage.removeItem('wt_session');
    google.accounts.id.prompt();
    throw new Error('Please sign in again.');
  }
  return result;
}

async function loadEntries() {
  showLoading();
  try {
    const result = await api('getEntries');
    state.entries = result.entries || [];
    renderDashboard();
    renderHistory();
  } catch(e) {
    showToast(e.message || 'Could not load data. Check your connection.', 'error');
  }
  hideLoading();
}

// ═══════════════════════════════════════════════
// SAVE ENTRY
// ═══════════════════════════════════════════════
async function saveEntry() {
  const btn = document.getElementById('save-btn');
  const date = document.getElementById('entry-date').value;
  if (!date) { showToast('Please select a date.', 'error'); return; }

  const data = {
    date,
    energy:        parseFloat(document.getElementById('slider-energy').value),
    mental:        parseFloat(document.getElementById('slider-mental').value),
    relationships: parseFloat(document.getElementById('slider-relationships').value),
    meaning:       parseFloat(document.getElementById('slider-meaning').value),
    highlight:     document.getElementById('entry-highlight').value.trim()
  };

  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    await api('addEntry', data);
    showToast('✓ Check-in saved!', 'success');
    setTodayDate();
    SLIDERS.forEach(s => {
      const el = document.getElementById('slider-' + s.id);
      el.value = 5; updateSliderBadge(el);
    });
    document.getElementById('entry-highlight').value = '';
    await loadEntries();
    switchTab('dashboard');
  } catch(e) {
    showToast(e.message || 'Save failed. Try again.', 'error');
  }
  btn.disabled = false; btn.textContent = 'Save Check-in';
}

// ═══════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════
function renderDashboard() {
  renderChart();
  renderInsights();
  renderTopDays();
}

// ── Chart ───────────────────────────────────────
function renderChart() {
  const ctx = document.getElementById('trend-chart').getContext('2d');
  if (state.chart) { state.chart.destroy(); state.chart = null; }

  if (!state.entries.length) return;

  // Get last 30 days
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 30);
  const recent = state.entries.filter(e => new Date(e.date) >= cutoff);

  // Average per day
  const byDate = {};
  recent.forEach(e => {
    if (!byDate[e.date]) byDate[e.date] = [];
    byDate[e.date].push(e);
  });

  const dates = Object.keys(byDate).sort();
  const avg = (arr, key) => arr.reduce((s, e) => s + e[key], 0) / arr.length;

  const labels = dates.map(d => {
    const dt = new Date(d + 'T12:00:00');
    return dt.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric' });
  });

  const datasets = [
    { label: 'Energy',        key: 'energy',        color: '#7c3aed' },
    { label: 'Mental',        key: 'mental',         color: '#a78bfa' },
    { label: 'Relationships', key: 'relationships',  color: '#c4b5fd' },
    { label: 'Meaning',       key: 'meaning',        color: '#ddd6fe' }
  ].map(({ label, key, color }) => ({
    label,
    data: dates.map(d => +avg(byDate[d], key).toFixed(2)),
    borderColor: color,
    backgroundColor: color + '18',
    borderWidth: 2,
    pointRadius: 3,
    pointBackgroundColor: color,
    tension: 0.35
  }));

  state.chart = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top', labels: { boxWidth: 10, font: { family: 'DM Sans', size: 11 } } },
        tooltip: { bodyFont: { family: 'DM Sans' }, titleFont: { family: 'DM Sans' } }
      },
      scales: {
        x: { ticks: { font: { family: 'DM Sans', size: 10 }, maxRotation: 45 }, grid: { display: false } },
        y: { min: 0, max: 10, ticks: { stepSize: 2, font: { family: 'DM Sans', size: 10 } } }
      }
    }
  });
}

// ── Weekly Insights ─────────────────────────────
function renderInsights() {
  const grid = document.getElementById('insights-grid');
  if (!state.entries.length) {
    grid.innerHTML = '<p style="color:var(--text-muted);font-size:13px;grid-column:1/-1;">No data yet — complete your first check-in!</p>';
    return;
  }

  const now = new Date();
  const d7  = new Date(now); d7.setDate(d7.getDate() - 7);
  const d14 = new Date(now); d14.setDate(d14.getDate() - 14);

  const thisWeek = state.entries.filter(e => new Date(e.date) >= d7);
  const lastWeek = state.entries.filter(e => new Date(e.date) >= d14 && new Date(e.date) < d7);
  const avg = (arr, key) => arr.length ? arr.reduce((s,e) => s+e[key], 0) / arr.length : null;

  const metrics = [
    { key: 'energy', label: 'Energy' },
    { key: 'mental', label: 'Mental' },
    { key: 'relationships', label: 'Relationships' },
    { key: 'meaning', label: 'Meaning' }
  ];

  grid.innerHTML = metrics.map(({ key, label }) => {
    const curr = avg(thisWeek, key);
    const prev = avg(lastWeek, key);
    if (curr === null) return `<div class="insight-card"><div class="insight-label">${label}</div><div class="insight-score">—</div></div>`;
    const delta = prev !== null ? curr - prev : null;
    const dotClass = delta === null ? 'flat' : delta > 0.05 ? 'up' : delta < -0.05 ? 'down' : 'flat';
    const deltaStr = delta === null ? 'No prior data' :
      (delta >= 0 ? '+' : '') + delta.toFixed(2) + ' vs last week';
    return `
      <div class="insight-card">
        <div class="insight-label">${label}</div>
        <div class="insight-score">${curr.toFixed(2)}</div>
        <div class="insight-delta">
          <div class="dot ${dotClass}"></div>
          <span style="color:var(--text-muted)">${deltaStr}</span>
        </div>
      </div>`;
  }).join('');
}

// ── Top Days ────────────────────────────────────
function renderTopDays() {
  const renderList = (id, isWeekend) => {
    const el = document.getElementById(id);
    if (!state.entries.length) { el.innerHTML = '<li style="color:var(--text-muted);font-size:13px;padding:12px 0;">No data yet.</li>'; return; }

    const byDate = {};
    state.entries.forEach(e => {
      const d = new Date(e.date + 'T12:00:00');
      const we = d.getDay() === 0 || d.getDay() === 6;
      if (we !== isWeekend) return;
      if (!byDate[e.date]) byDate[e.date] = [];
      byDate[e.date].push(e);
    });

    const top = Object.entries(byDate)
      .map(([date, entries]) => {
        const scores = entries.flatMap(e => [e.energy, e.mental, e.relationships, e.meaning]);
        return { date, score: scores.reduce((a,b)=>a+b,0)/scores.length };
      })
      .sort((a,b) => b.score - a.score)
      .slice(0, 3);

    if (!top.length) { el.innerHTML = '<li style="color:var(--text-muted);font-size:13px;padding:12px 0;">No data yet.</li>'; return; }

    el.innerHTML = top.map(({ date, score }, i) => {
      const d = new Date(date + 'T12:00:00');
      const label = d.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric', year: 'numeric' });
      return `<li>
        <span class="rank">${['🥇','🥈','🥉'][i]}</span>
        <span class="day-date">${label}</span>
        <span class="day-score">${score.toFixed(2)}</span>
      </li>`;
    }).join('');
  };

  renderList('top-weekends', true);
  renderList('top-weekdays', false);
}

// ═══════════════════════════════════════════════
// HISTORY
// ═══════════════════════════════════════════════
function renderHistory() {
  const el = document.getElementById('history-content');
  if (!state.entries.length) {
    el.innerHTML = '<div class="empty-state"><span>📋</span>No entries yet.<br>Start with your first daily check-in!</div>';
    return;
  }
  el.innerHTML = `
    <div class="history-scroll">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Energy</th>
            <th>Mental</th>
            <th>Relate.</th>
            <th>Meaning</th>
            <th>Highlight</th>
          </tr>
        </thead>
        <tbody>
          ${state.entries.map(e => {
            const d = new Date(e.date + 'T12:00:00');
            const label = d.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric', year: '2-digit' });
            return `<tr>
              <td><strong>${label}</strong></td>
              <td><span class="score-pill">${e.energy.toFixed(1)}</span></td>
              <td><span class="score-pill">${e.mental.toFixed(1)}</span></td>
              <td><span class="score-pill">${e.relationships.toFixed(1)}</span></td>
              <td><span class="score-pill">${e.meaning.toFixed(1)}</span></td>
              <td class="highlight-cell" title="${e.highlight}">${e.highlight || '—'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
}

// ═══════════════════════════════════════════════
// SLIDERS
// ═══════════════════════════════════════════════
function buildSliders() {
  const wrap = document.getElementById('sliders-wrap');
  wrap.innerHTML = SLIDERS.map(s => `
    <div class="field-group">
      <div class="field-label">${s.label} *</div>
      <div class="field-desc">${s.desc}</div>
      <div class="slider-track">
        <div class="slider-value-badge" id="badge-${s.id}">5.0</div>
        <input type="range" id="slider-${s.id}"
          min="0" max="10" step="0.5" value="5"
          oninput="updateSliderBadge(this)"
          style="width:100%">
      </div>
      <div class="slider-labels"><span>0</span><span>5</span><span>10</span></div>
    </div>`).join('');
}

function updateSliderBadge(el) {
  const id = el.id.replace('slider-', '');
  const badge = document.getElementById('badge-' + id);
  const pct = (parseFloat(el.value) / 10);
  // Position badge along the track (accounting for thumb width)
  const thumbW = 26;
  const trackW = el.offsetWidth;
  const left = thumbW/2 + pct * (trackW - thumbW);
  badge.style.left = left + 'px';
  badge.textContent = parseFloat(el.value).toFixed(1);
}

window.addEventListener('resize', () => {
  SLIDERS.forEach(s => {
    const el = document.getElementById('slider-' + s.id);
    if (el) updateSliderBadge(el);
  });
});

// ═══════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════
const TAB_TITLES = { dashboard: 'Dashboard', checkin: 'Daily Check-in', history: 'History' };

function switchTab(tab) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('nav-' + tab).classList.add('active');
  document.getElementById('header-title').textContent = TAB_TITLES[tab];
  state.currentTab = tab;

  if (tab === 'checkin') {
    // Trigger badge positions after layout
    setTimeout(() => SLIDERS.forEach(s => {
      const el = document.getElementById('slider-' + s.id);
      if (el) updateSliderBadge(el);
    }), 50);
  }
}

// ═══════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════
function setTodayDate() {
  const el = document.getElementById('entry-date');
  if (el) el.value = new Date().toISOString().slice(0, 10);
}

function parseJWT(token) {
  return JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
}

function isTokenExpired(token) {
  try {
    const p = parseJWT(token);
    return Date.now() >= p.exp * 1000;
  } catch { return true; }
}

function showLoading() { document.getElementById('loading').classList.remove('hidden'); }
function hideLoading() { document.getElementById('loading').classList.add('hidden'); }

let toastTimer;
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = 'toast', 3000);
}

// ── Service Worker ──────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
